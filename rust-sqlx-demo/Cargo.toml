[package]
name = "rust-sqlx-demo"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# sqlx：异步 SQL 工具箱（本教程主角）
# - runtime-tokio: 跑在 tokio 上
# - sqlite: SQLite 驱动（换 PostgreSQL 用 "postgres" feature）
# - macros: query! / query_as! 编译期校验
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
